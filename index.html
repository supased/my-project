<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReadTrack – Personal Reading Analytics</title>
<style>
:root{--bg:#f4f5fb;--card:rgba(255,255,255,.8);--tx:#141833;--mu:#6b7194;--bd:rgba(20,24,51,.09);--pr:#6d4aff;--pr2:#3b5bff;--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070a1a;--card:rgba(24,29,64,.65);--tx:#eef0ff;--mu:#9aa1cf;--bd:rgba(255,255,255,.09)}}

body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Thai',Roboto,Arial,sans-serif}

#hT{font-weight:800;font-size:clamp(30px,7vw,96px);letter-spacing:-.02em;text-shadow:0 4px 30px rgba(0,0,0,.5)}
#hG{opacity:0;font-weight:700;font-size:clamp(20px,3.4vw,40px)}

#hP{position:absolute;left:0;right:0;bottom:0;height:2px;background:#ffffff1f}#hPi{height:100%;background:#fff;transform:scaleX(0);transform-origin:left}

main{flex:1;padding:24px;max-width:1100px;margin:0 auto;width:100%;animation:up .4s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.g{display:grid;gap:14px}.c4{grid-template-columns:repeat(4,1fr)}.c2{grid-template-columns:1fr 1fr}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;box-shadow:0 8px 30px #0000000d;backdrop-filter:blur(12px);min-width:0}
/* Shine Border (พอร์ตจาก ShineBorder: color=["#A07CFE","#FE8FB5","#FFBE7B"]) */
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;background-image:radial-gradient(transparent,transparent,#A07CFE,#FE8FB5,#FFBE7B,transparent,transparent);background-size:300% 300%;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;animation:shine 14s linear infinite;will-change:background-position}
@keyframes shine{0%{background-position:0% 0%}50%{background-position:100% 100%}to{background-position:0% 0%}}
@media(prefers-reduced-motion:reduce){.card::before{animation:none}}
.card small{color:var(--mu);display:block;margin-bottom:6px}.card .v{font-size:24px;font-weight:700}
h2{margin:0 0 14px}h3{margin:0 0 10px;font-size:15px}
.btn{background:linear-gradient(90deg,var(--pr),var(--pr2));color:#fff;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;font-size:14px;font-weight:600}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;font:inherit;margin-bottom:8px}
label{font-size:12px;color:var(--mu)}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2));transition:width .6s}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}
.wrap{overflow-x:auto}.demo{background:#f59e0b26;border:1px solid #f59e0b66;border-radius:14px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto}.heat i{width:12px;height:12px;border-radius:3px;background:var(--bd)}
.clock{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modal>div{background:var(--bg);border-radius:20px;padding:20px;width:100%;max-width:460px;max-height:90dvh;overflow:auto;border:1px solid var(--bd)}
#focus{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 30%,#241a6b,#05070d);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px}#toast div{background:linear-gradient(90deg,var(--pr),var(--pr2));color:#fff;padding:10px 18px;border-radius:14px;animation:up .4s}
.lock{opacity:.4;filter:grayscale(1)}.empty{text-align:center;padding:30px;color:var(--mu)}
@media(max-width:800px){nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-top:1px solid var(--bd);z-index:20;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}nav b{display:none}nav button{white-space:nowrap;font-size:12px;padding:8px 10px}main{padding:16px 14px 90px}.c4{grid-template-columns:1fr 1fr}.c2{grid-template-columns:1fr}.clock{font-size:48px}}
/* ===== Liquid Glass (ปุ่มกระจกเหลว + ธีมเดิม Navy/Purple) ===== */
:root{--glass:rgba(255,255,255,.5);--glass-bd:rgba(255,255,255,.75);--hl:rgba(255,255,255,.95)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(255,255,255,.09);--glass-bd:rgba(255,255,255,.22);--hl:rgba(255,255,255,.45)}}
:root[data-theme="dark"]{--glass:rgba(255,255,255,.09);--glass-bd:rgba(255,255,255,.22);--hl:rgba(255,255,255,.45)}
body{background-image:radial-gradient(60% 50% at 12% 8%,#6d4aff40,transparent),radial-gradient(50% 40% at 92% 28%,#3b5bff38,transparent),radial-gradient(50% 50% at 50% 100%,#ec489928,transparent);background-attachment:fixed}
.btn,.chip,nav button,#skip{position:relative;overflow:hidden;isolation:isolate;display:block;-webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);border:1px solid var(--glass-bd);background:var(--glass);color:var(--tx);box-shadow:inset 0 1px 1px var(--hl),inset 0 -10px 18px #ffffff0f,0 8px 24px #1b1e5a26;transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,background .3s}

.btn:hover::after,.chip:hover::after,nav button:hover::after,#skip:hover::after{transform:translateX(120%)}
.btn:hover,.chip:hover,nav button:hover,#skip:hover{transform:translateY(-1px) scale(1.03)}
.btn:active,.chip:active,nav button:active,#skip:active{transform:scale(.95)}
.btn{background:linear-gradient(135deg,rgba(109,74,255,.8),rgba(59,91,255,.62));color:#fff;border-color:rgba(255,255,255,.42);box-shadow:inset 0 1px 1px rgba(255,255,255,.75),inset 0 -10px 18px rgba(255,255,255,.1),0 10px 28px rgba(90,70,255,.4)}
.btn.s{background:var(--glass);color:var(--tx);box-shadow:inset 0 1px 1px var(--hl),inset 0 -10px 18px #ffffff0f,0 8px 24px #1b1e5a26}
.chip.on{background:linear-gradient(135deg,rgba(109,74,255,.88),rgba(59,91,255,.68));color:#fff;border-color:rgba(255,255,255,.45)}
nav button{border-radius:14px;border-color:transparent;box-shadow:none;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
nav button:hover,nav button.on{border-color:var(--glass-bd);background:linear-gradient(135deg,rgba(109,74,255,.3),rgba(59,91,255,.18));box-shadow:inset 0 1px 1px var(--hl),0 6px 18px #1b1e5a22;color:var(--tx)}
#skip{color:#fff;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4)}
@media(prefers-reduced-motion:reduce){.btn,.chip,nav button,#skip{transition:none}.btn::after,.chip::after,nav button::after,#skip::after{display:none}}
/* ===== Night Mode (โทนอบอุ่น ลดแสงสีฟ้า ถนอมสายตาตอนกลางคืน) ===== */
:root[data-theme="night"]{--bg:#0a0705;--card:rgba(34,23,15,.62);--tx:#f1dfc8;--mu:#b39a7d;--bd:rgba(255,200,140,.11);--pr:#e0913a;--pr2:#c2571f;--glass:rgba(255,190,120,.07);--glass-bd:rgba(255,190,120,.22);--hl:rgba(255,210,160,.35);color-scheme:dark}
:root[data-theme="night"] body{background-image:radial-gradient(60% 50% at 12% 8%,#e0913a1f,transparent),radial-gradient(50% 40% at 92% 28%,#c2571f1a,transparent),radial-gradient(50% 50% at 50% 100%,#8f4a1a1a,transparent)}

:root[data-theme="night"] .btn,:root[data-theme="night"] .chip.on{background:linear-gradient(135deg,rgba(224,145,58,.82),rgba(194,87,31,.66));color:#fff8ee;border-color:rgba(255,220,170,.4);box-shadow:inset 0 1px 1px rgba(255,225,180,.6),inset 0 -10px 18px rgba(255,200,140,.08),0 10px 28px rgba(194,87,31,.35)}
:root[data-theme="night"] .btn.s{background:var(--glass);color:var(--tx);box-shadow:inset 0 1px 1px var(--hl),0 8px 24px #00000055}

:root[data-theme="night"] .demo{background:#e0913a22;border-color:#e0913a66}
</style></head><body>
<section id="hero"><video id="hv" muted playsinline preload="auto"></video>
<div class="ov"><span id="hT"></span></div><div class="ov"><span id="hG"></span></div>
<div id="hH"><div id="hHt"></div>↓</div><button id="skip">Skip ›</button><span id="sig"></span>
<div id="hP"><div id="hPi"></div></div></section>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="toast"></div><div id="ov"></div>
<script>
// ===== CONFIG (เปลี่ยน video/ข้อความได้ที่นี่ที่เดียว) =====
const HERO={videoSrc:"https://cdn.21st.dev/assets/mirror/21/21a77eac28eacbb7e142016eefeaa0b4a766619e51113629a3bc6df6af066c0f.mp4",title:"READ. FOCUS. GROW.",scrollHint:"START READING",tagline:"",signature:{name:"ReadTrack",url:"#"},scrubDistance:3200};
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
// ===== storage =====
const K="readtrack.v1";let mem=null;
const load=()=>{try{const r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}return mem};
const persist=()=>{mem=S;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const dk=d=>{d=new Date(d);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const DAY=864e5,SUBJ=["Mathematics","English","Science","Thai"];
function seed(){let x=7;const r=()=>(x=(x*9301+49297)%233280)/233280;const ss=[],now=Date.now();
 for(let d=0;d<60;d++){if(d>7&&r()<.3)continue;const n=1+(r()<.4);for(let k=0;k<n;k++){const t=new Date(now-d*DAY);t.setHours(k?19:17+Math.floor(r()*3),0,0,0);const dur=Math.round(25+r()*70);
 ss.push({id:"d"+d+k,date:dk(t),start:t.getTime(),end:t.getTime()+dur*6e4,dur,subject:SUBJ[Math.floor(r()*4)],book:["Calculus Basic","English Grammar","Physics Basic"][Math.floor(r()*3)],topic:"Demo",pages:Math.round(8+r()*20),focus:3+Math.round(r()*2),mood:"😊",note:"",demo:1})}}
 return ss}
let S=load()||{theme:null,demo:true,sessions:seed(),books:[{id:"b1",title:"Calculus Basic",author:"Demo",subject:"Mathematics",cat:"Textbook",total:300,last:120},{id:"b2",title:"English Grammar",author:"Demo",subject:"English",cat:"Language",total:200,last:80},{id:"b3",title:"Physics Basic",author:"Demo",subject:"Science",cat:"Textbook",total:300,last:120}],goals:[{id:"g1",type:"daily",target:120},{id:"g2",type:"total",target:100}],ach:[]};
// ===== statistics / goals / achievements =====
const fm=m=>{m=Math.round(m);return m<60?m+"m":Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m"};
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const RANGES=[["7 Days",7],["30 Days",30],["3 Months",90],["6 Months",180],["1 Year",365],["All Time",0]];let RG=30;
const inRange=(n)=>n?S.sessions.filter(s=>s.start>=Date.now()-n*DAY):S.sessions;
function streaks(){const ds=[...new Set(S.sessions.map(s=>s.date))].sort();let lg=0,run=0,prev=null;
 ds.forEach(d=>{run=prev&&(new Date(d)-new Date(prev))/DAY===1?run+1:1;lg=Math.max(lg,run);prev=d});
 const set=new Set(ds);let cur=0,t=new Date();if(!set.has(dk(t)))t=new Date(Date.now()-DAY);
 while(set.has(dk(t))){cur++;t=new Date(t-DAY)}return{cur,lg}}
const byDay=d=>sum(S.sessions.filter(s=>s.date===dk(d)),s=>s.dur);
function agg(ss){const m={};ss.forEach(s=>m[s.subject]=(m[s.subject]||0)+s.dur);return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function goalProg(g){let c=0;const st=streaks();
 if(g.type==="daily")c=byDay(new Date());
 if(g.type==="weekly")c=sum(S.sessions.filter(s=>s.start>=Date.now()-7*DAY),s=>s.dur);
 if(g.type==="total")c=sum(S.sessions,s=>s.dur)/60;
 if(g.type==="streak")c=st.cur;
 if(g.type==="subject")c=sum(S.sessions.filter(s=>s.subject===g.subject),s=>s.dur)/60;
 const unit=g.type==="daily"||g.type==="weekly"?"min":g.type==="streak"?"days":"h";
 const name={daily:`อ่านวันละ ${g.target} นาที`,weekly:`อ่านสัปดาห์ละ ${g.target} นาที`,total:`อ่านครบ ${g.target} ชั่วโมง`,streak:`อ่าน ${g.target} วันติดต่อกัน`,subject:`อ่าน ${g.subject} ${g.target} ชั่วโมง`}[g.type];
 return{name,c:Math.round(c*10)/10,unit,pct:Math.min(100,Math.round(c/g.target*100))}}
const ACH=[["first","🏅","First Session","อ่านหนังสือครั้งแรก",()=>S.sessions.length>0],["s7","🔥","7 Day Streak","อ่านติดต่อกัน 7 วัน",()=>streaks().lg>=7],["h50","📚","Book Lover","อ่านครบ 50 ชั่วโมง",()=>sum(S.sessions,s=>s.dur)>=3000],["focus","⏱","Focus Master","Session เดียวเกิน 2 ชั่วโมง",()=>S.sessions.some(s=>s.dur>120)],["goal","🎯","Goal Crusher","ทำเป้าหมายสำเร็จ",()=>S.goals.some(g=>goalProg(g).pct>=100)],["h100","🏆","100 Hours","อ่านครบ 100 ชั่วโมง",()=>sum(S.sessions,s=>s.dur)>=6000]];
function checkAch(){ACH.forEach(a=>{if(!S.ach.includes(a[0])&&a[4]()){S.ach.push(a[0]);toast(`${a[1]} ปลดล็อก: ${a[2]}!`)}})}
function insights(){const ss=S.sessions;if(ss.length<3)return["เริ่มอ่านหนังสือเพื่อให้ระบบวิเคราะห์พฤติกรรมของคุณ"];const o=[];
 const w1=sum(ss.filter(s=>s.start>=Date.now()-7*DAY),s=>s.dur),w0=sum(ss.filter(s=>s.start<Date.now()-7*DAY&&s.start>=Date.now()-14*DAY),s=>s.dur);
 if(w0>0){const p=Math.round((w1-w0)/w0*100);o.push(`สัปดาห์นี้คุณอ่านหนังสือ${p>=0?"มากกว่า":"น้อยกว่า"}สัปดาห์ก่อน ${Math.abs(p)}%`)}
 const h=Array(24).fill(0);ss.forEach(s=>h[new Date(s.start).getHours()]+=s.dur);let bi=0,bv=0;for(let i=0;i<24;i++){const v=h[i]+h[(i+1)%24];if(v>bv){bv=v;bi=i}}
 o.push(`คุณมักอ่านหนังสือในช่วง ${String(bi).padStart(2,"0")}:00–${String((bi+2)%24).padStart(2,"0")}:00`);
 o.push(`วิชาที่คุณใช้เวลาอ่านมากที่สุดคือ ${agg(ss)[0][0]}`);
 const days=Math.max(1,Math.ceil((Date.now()-Math.min(...ss.map(s=>s.start)))/DAY));o.push(`ค่าเฉลี่ยการอ่านต่อวันคือ ${fm(sum(ss,s=>s.dur)/days)}`);
 const st=streaks();if(st.cur>0)o.push(`คุณอ่านหนังสือติดต่อกันมาแล้ว ${st.cur} วัน`);return o}
// ===== charts (SVG) =====
function line(){const n=RG===7?7:RG===30?30:RG===90?13:RG===180?26:52,b=RG<=30&&RG>0?1:7,pts=[];
 for(let i=n-1;i>=0;i--){const e=Date.now()-i*b*DAY,st=e-b*DAY;pts.push(sum(S.sessions.filter(s=>s.start>st&&s.start<=e),s=>s.dur)/60)}
 const mx=Math.max(1,...pts),W=600,H=180,px=i=>20+i*(W-40)/Math.max(1,n-1),py=v=>H-20-v/mx*(H-40);
 const d=pts.map((v,i)=>(i?"L":"M")+px(i).toFixed(1)+" "+py(v).toFixed(1)).join(" ");
 return`<svg viewBox="0 0 ${W} ${H}" width="100%"><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--pr)" stop-opacity=".35"/><stop offset="1" style="stop-color:var(--pr)" stop-opacity="0"/></linearGradient></defs><path d="${d} L${px(n-1)} ${H-20} L${px(0)} ${H-20}Z" fill="url(#lg)"/><path d="${d}" fill="none" style="stroke:var(--pr)" stroke-width="3" stroke-linecap="round"/><text x="20" y="14" fill="var(--mu)" font-size="11">max ${mx.toFixed(1)}h / ${b===1?"day":"week"}</text></svg>`}
